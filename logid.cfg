devices: (
{
    name: "Wireless Mouse MX Master 3"; # Change to "MX Master 3S" or "MX Master 4" if applicable


    # Adjust sensor sensitivity (DPI)
    dpi: 1000;

    # SmartShift settings (MagSpeed wheel auto-switching)
    smartshift: {
        on: true;
        threshold: 10; # Resistance before auto-switching to free spin
    };

    # High-resolution smooth scrolling
    hiresscroll: {
        hires: true;
        invert: false;
        target: false;
    };
   up: {
            mode: "Axis";
            axis: "REL_WHEEL";
            axis_multiplier: 5.0;  # Increase for faster scroll, decrease (e.g. 0.5) for slower
        };
        down: {
            mode: "Axis";
            axis: "REL_WHEEL";
            axis_multiplier: -5.0; # Keep matching negative value of 'up'
        };


    # Button remappings & Gestures
    buttons: (
        # Thumb Gesture Button (Cid 0xc4)
        {
            cid: 0xc4;
            action: {
                type: "Gestures";
                gestures: (
                    # Click without moving: Open Overview / Super key
                    {
                        direction: "None";
                        mode: "OnRelease";
                        action: {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA"];
                        };
                    },
                    # Hold Thumb + Move Right: Next Workspace
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action: {
                            type: "Keypress";
                            keys: ["KEY_LEFTCTRL", "KEY_LEFTALT", "KEY_RIGHT"];
                        };
                    },
                    # Hold Thumb + Move Left: Previous Workspace
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action: {
                            type: "Keypress";
                            keys: ["KEY_LEFTCTRL", "KEY_LEFTALT", "KEY_LEFT"];
                        };
                    },
                    # Hold Thumb + Move Up: Volume Up
                    {
                        direction: "Up";
                        mode: "OnInterval";
                        interval: 50;
                        action: {
                            type: "Keypress";
                            keys: ["KEY_VOLUMEUP"];
                        };
                    },
                    # Hold Thumb + Move Down: Volume Down
                    {
                        direction: "Down";
                        mode: "OnInterval";
                        interval: 50;
                        action: {
                            type: "Keypress";
                            keys: ["KEY_VOLUMEDOWN"];
                        };
                    }
                );
            };
        }
    );
}
);
